name: Build Tamweely Web for iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamweely-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - name: Install dependencies
        run: flutter pub get
      - name: Enable PDF preview on web
        run: dart run pdfx:install_web
      - name: Build Flutter web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter build web --release --base-href "${BASE_PATH%/}/"
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/assets/assets/images/logo.jpg
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Tamweely
        id: deployment
        uses: actions/deploy-pages@v4
