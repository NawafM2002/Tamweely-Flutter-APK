name: Build Tamweely APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - name: Prepare Android Gradle wrapper
        run: bash tool/setup_android.sh
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK (demo signing)
        run: flutter build apk --release
      - name: Prepare download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Tamweely.apk
          (cd dist && sha256sum Tamweely.apk > SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamweely-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
